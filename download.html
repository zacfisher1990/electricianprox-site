<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download ElectricianPro X</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #fff;
            margin-bottom: 2.5rem;
            opacity: 0.7;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        p {
            color: rgba(255,255,255,0.55);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2.5rem;
        }
        .badges {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        .badge-link img {
            height: 52px;
            width: auto;
            display: block;
            transition: opacity 0.15s;
        }
        .badge-link:hover img { opacity: 0.8; }
        .badge-link.highlighted img {
            filter: drop-shadow(0 0 12px rgba(99,183,255,0.4));
        }
        .badge-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            margin-top: 0.3rem;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .redirecting p { margin-bottom: 0.5rem; }
        .detected { font-size: 0.85rem; color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">ElectricianPro X</div>

        <div id="redirecting" class="redirecting" style="display:none">
            <div class="spinner"></div>
            <h1>Taking you there…</h1>
            <p id="detected-msg" class="detected"></p>
        </div>

        <div id="fallback" style="display:none">
            <h1>Download the App</h1>
            <p>Free to download. No credit card required.</p>
            <div class="badges">
                <a id="ios-badge" href="https://apps.apple.com/app/id6755925920" class="badge-link" target="_blank" rel="noopener">
                    <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
                </a>
                <a id="android-badge" href="https://play.google.com/store/apps/details?id=com.electricianprox.app" class="badge-link" target="_blank" rel="noopener">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
                </a>
            </div>
        </div>
    </div>

    <script>
        var IOS_URL = 'https://apps.apple.com/app/id6755925920';
        var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.electricianprox.app';

        var ua = navigator.userAgent;
        var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        var isAndroid = /Android/.test(ua);

        if (isIOS) {
            document.getElementById('redirecting').style.display = 'block';
            document.getElementById('detected-msg').textContent = 'Opening App Store…';
            window.location.href = IOS_URL;
        } else if (isAndroid) {
            document.getElementById('redirecting').style.display = 'block';
            document.getElementById('detected-msg').textContent = 'Opening Google Play…';
            window.location.href = ANDROID_URL;
        } else {
            // Desktop or unknown — show both badges
            var fallback = document.getElementById('fallback');
            fallback.style.display = 'block';
        }
    </script>
</body>
</html>
