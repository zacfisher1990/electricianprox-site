<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Electrician Pro X</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #272D34;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p {
            color: rgba(255,255,255,0.55);
            font-size: 1rem;
            line-height: 1.5;
        }
        .fallback {
            display: inline-block;
            margin-top: 1.5rem;
            color: #fff;
            font-size: 0.95rem;
            text-decoration: underline;
            opacity: 0.8;
        }
        .fallback:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Taking you there&hellip;</p>
        <a id="fallback-link" class="fallback" href="https://app.electricianprox.com/?utm_source=postcard&amp;utm_medium=directmail&amp;utm_campaign=mo2026">Tap here if nothing happens</a>
    </div>

    <script>
        var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.electricianprox.app&referrer=utm_source%3Dpostcard%26utm_medium%3Ddirectmail%26utm_campaign%3Dmo2026';
        var IOS_URL = 'https://apps.apple.com/app/id6755925920';
        var DESKTOP_URL = 'https://app.electricianprox.com/?utm_source=postcard&utm_medium=directmail&utm_campaign=mo2026';

        var ua = navigator.userAgent || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        var isAndroid = /Android/.test(ua);

        var target = isAndroid ? ANDROID_URL : (isIOS ? IOS_URL : DESKTOP_URL);

        document.getElementById('fallback-link').href = target;

        window.location.replace(target);
    </script>
</body>
</html>
